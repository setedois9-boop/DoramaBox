<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel Administrativo - DoramaBox Oficial</title>
  <meta name="description" content="Acesso restrito ao Painel Administrativo do DoramaBox. Informe suas credenciais de administrador para acessar o sistema.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F172A">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="/assets/img/app-icon.png">

  <style>
    :root {
      --bg-dark: #090D16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      
      --pink-primary: #EC4899;
      --pink-hover: #DB2777;
      --purple-primary: #8B5CF6;
      --purple-hover: #7C3AED;
      
      --gradient-brand: linear-gradient(135deg, #EC4899 0%, #8B5CF6 100%);
      --gradient-hover: linear-gradient(135deg, #F43F5E 0%, #EC4899 45%, #8B5CF6 100%);
      
      --text-white: #FFFFFF;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      
      --input-bg: rgba(15, 23, 42, 0.7);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #EC4899;
      
      --font-heading: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Fundo com efeito de luzes e gradientes ambiente */
    .ambient-glow-1 {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 400px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.22) 0%, rgba(139, 92, 246, 0.12) 50%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-2 {
      position: fixed;
      bottom: -100px;
      right: 10%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, transparent 70%);
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
    }

    /* Botão flutuante para voltar ao site */
    .back-home-link {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .back-home-link:hover {
      color: var(--text-white);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(236, 72, 153, 0.4);
      transform: translateX(-2px);
    }

    /* Card Central de Login */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 38px 30px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7),
                  0 0 40px rgba(236, 72, 153, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: fadeInScale 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Cabeçalho do Card (Logo e Títulos) */
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 16px;
    }

    .logo-img {
      width: 82px;
      height: 82px;
      border-radius: 20px;
      display: block;
      box-shadow: 0 8px 24px rgba(236, 72, 153, 0.35);
      border: 2px solid rgba(236, 72, 153, 0.4);
      background: #FFFFFF;
      transition: transform 0.3s ease;
    }

    .logo-wrapper:hover .logo-img {
      transform: scale(1.04) rotate(-1deg);
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-highlight {
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .badge-painel {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      background: rgba(236, 72, 153, 0.12);
      border: 1px solid rgba(236, 72, 153, 0.28);
      color: #F472B6;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 9999px;
    }

    .badge-painel::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #EC4899;
      border-radius: 50%;
      box-shadow: 0 0 8px #EC4899;
    }

    .login-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.45;
    }

    /* Formulário */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      text-align: left;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #CBD5E1;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.01em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-dim);
      pointer-events: none;
      display: flex;
      align-items: center;
      transition: color 0.2s ease;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      padding: 13px 14px 13px 44px;
      color: var(--text-white);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: #475569;
    }

    .form-input:focus {
      border-color: var(--pink-primary);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
    }

    .input-wrapper:focus-within .input-icon {
      color: var(--pink-primary);
    }

    /* Botão de Ver/Ocultar Senha */
    .btn-toggle-pass {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s ease;
    }

    .btn-toggle-pass:hover {
      color: var(--text-white);
    }

    /* Linha auxiliar: Lembrar-me e Esqueci a senha */
    .form-row-aux {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-top: -6px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      accent-color: var(--pink-primary);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .forgot-link {
      color: #F472B6;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .forgot-link:hover {
      color: #FBCFE8;
      text-decoration: underline;
    }

    /* Botão Principal de Login */
    .btn-login {
      width: 100%;
      background: var(--gradient-brand);
      color: #FFFFFF;
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.35);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      margin-top: 6px;
    }

    .btn-login:hover {
      background: var(--gradient-hover);
      box-shadow: 0 12px 30px rgba(236, 72, 153, 0.5);
      transform: translateY(-1.5px);
    }

    .btn-login:active {
      transform: translateY(1px);
      box-shadow: 0 5px 15px rgba(236, 72, 153, 0.3);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Mensagem de Feedback / Notificação */
    .login-feedback {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
      text-align: left;
      margin-top: 14px;
      animation: fadeIn 0.3s ease;
    }

    .login-feedback.error {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
    }

    .login-feedback.info {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.35);
      color: #DDD6FE;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Rodapé do Card */
    .login-footer {
      margin-top: 24px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .security-notice {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: var(--text-dim);
    }

    .security-notice svg {
      color: #10B981;
    }

    .mobile-back-link {
      display: none;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 4px;
      transition: color 0.2s ease;
    }

    .mobile-back-link:hover {
      color: var(--text-white);
    }

    /* Responsivo para Celular */
    @media (max-width: 640px) {
      .back-home-link {
        display: none;
      }
      .mobile-back-link {
        display: inline-block;
      }
      .login-container {
        padding: 30px 20px;
        border-radius: 20px;
      }
      .brand-title {
        font-size: 1.65rem;
      }
      .logo-img {
        width: 72px;
        height: 72px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Lights -->
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Botão Flutuante Voltar ao Site (Desktop) -->
  <a href="/" class="back-home-link" title="Voltar para a página principal">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    <span>Voltar ao site</span>
  </a>

  <!-- Card Principal de Login -->
  <div class="login-container">
    
    <!-- Cabeçalho com Logo -->
    <div class="login-header">
      <div class="logo-wrapper">
        <img src="/assets/img/app-icon.png" alt="Logo DoramaBox" class="logo-img" width="82" height="82">
      </div>
      
      <h1 class="brand-title">
        Dorama<span class="brand-highlight">Box</span>
      </h1>
      
      <div>
        <span class="badge-painel">Painel de Acesso</span>
      </div>

      <p class="login-desc">
        Informe seu e-mail e senha para acessar o painel de gerenciamento.
      </p>
    </div>

    <!-- Formulário de Login -->
    <form class="login-form" id="loginForm" onsubmit="handlePanelLogin(event)">
      
      <!-- Campo E-mail -->
      <div class="form-group">
        <label for="adminEmail" class="form-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          E-mail de acesso
        </label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input 
            type="email" 
            id="adminEmail" 
            name="email" 
            class="form-input" 
            placeholder="admin@doramabox.com" 
            required 
            autocomplete="email"
            autofocus>
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="form-group">
        <label for="adminPassword" class="form-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Senha
        </label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input 
            type="password" 
            id="adminPassword" 
            name="password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
            style="padding-right: 42px;">
          
          <button type="button" class="btn-toggle-pass" id="btnTogglePass" onclick="togglePasswordVisibility()" aria-label="Mostrar ou ocultar senha">
            <svg id="eyeIconShow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg id="eyeIconHide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <!-- Opções Auxiliares -->
      <div class="form-row-aux">
        <label class="remember-label">
          <input type="checkbox" id="rememberMe" checked>
          <span>Lembrar de mim</span>
        </label>
        <a href="javascript:void(0)" onclick="handleForgotPassword()" class="forgot-link">Esqueceu a senha?</a>
      </div>

      <!-- Botão de Login -->
      <button type="submit" class="btn-login" id="btnLoginSubmit">
        <span>ENTRAR NO PAINEL</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>

      <!-- Mensagem de Feedback -->
      <div id="loginFeedback" class="login-feedback" role="alert"></div>

    </form>

    <!-- Rodapé do Card -->
    <div class="login-footer">
      <div class="security-notice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>Acesso restrito e criptografado com SSL de 256 bits</span>
      </div>
      <a href="/" class="mobile-back-link">← Voltar para o site</a>
    </div>

  </div>

  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('adminPassword');
      const eyeShow = document.getElementById('eyeIconShow');
      const eyeHide = document.getElementById('eyeIconHide');
      
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeShow.style.display = 'none';
        eyeHide.style.display = 'block';
      } else {
        passInput.type = 'password';
        eyeShow.style.display = 'block';
        eyeHide.style.display = 'none';
      }
    }

    function handleForgotPassword() {
      const feedback = document.getElementById('loginFeedback');
      feedback.className = 'login-feedback info';
      feedback.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0; margin-top:2px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        <div>Para redefinir sua senha de administrador, entre em contato direto com o suporte técnico oficial.</div>
      `;
    }

    function handlePanelLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const btn = document.getElementById('btnLoginSubmit');
      const feedback = document.getElementById('loginFeedback');
      
      if (!email || !password) {
        feedback.className = 'login-feedback error';
        feedback.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0; margin-top:2px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <div>Por favor, preencha o e-mail e a senha de acesso.</div>
        `;
        return;
      }

      // Estado de Carregamento
      btn.disabled = true;
      const originalText = btn.innerHTML;
      btn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="spin-anim"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path></svg>
        <span>Verificando credenciais...</span>
      `;

      feedback.style.display = 'none';

      // Simulação de validação da tela de login
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = originalText;

        feedback.className = 'login-feedback error';
        feedback.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0; margin-top:2px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <div><strong>Acesso não autorizado:</strong> E-mail ou senha incorretos. Verifique suas credenciais de administrador.</div>
        `;
      }, 1000);
    }
  </script>

  <style>
    .spin-anim {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

</body>
</html>
